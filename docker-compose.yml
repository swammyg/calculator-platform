services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: ${ENV_FILE:-.env}
    environment:
      APP_DATABASE_URL: postgresql://app:${POSTGRES_PASSWORD:-change-me}@pgbouncer:5432/calculator
      APP_REDIS_URL: redis://redis:6379/0
      APP_REDIS_MAX_CONNECTIONS: 50
      APP_LOG_FORMAT: json
      APP_DEBUG: "false"
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app/app:ro
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: calculator
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d calculator"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgbouncer:
    image: edoburu/pgbouncer:1.25.2-p0
    environment:
      DATABASE_URL: postgresql://app:${POSTGRES_PASSWORD:-change-me}@db:5432/calculator
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 100
      DEFAULT_POOL_SIZE: 20
      ADMIN_USERS: app
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U app -d calculator"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  frontend:
    build:
      context: .
      dockerfile: frontend.Dockerfile
      args:
        VITE_GA_MEASUREMENT_ID: ${VITE_GA_MEASUREMENT_ID:-}
        VITE_ADSENSE_MODE: ${VITE_ADSENSE_MODE:-test}
        VITE_ADSENSE_CALCULATORS_CLIENT: ${VITE_ADSENSE_CALCULATORS_CLIENT:-}
        VITE_ADSENSE_CALCULATORS_LEADERBOARD: ${VITE_ADSENSE_CALCULATORS_LEADERBOARD:-}
        VITE_ADSENSE_CALCULATORS_SIDEBAR: ${VITE_ADSENSE_CALCULATORS_SIDEBAR:-}
        VITE_ADSENSE_CALCULATORS_RESULTS: ${VITE_ADSENSE_CALCULATORS_RESULTS:-}
        VITE_ADSENSE_TIME_CLIENT: ${VITE_ADSENSE_TIME_CLIENT:-}
        VITE_ADSENSE_TIME_LEADERBOARD: ${VITE_ADSENSE_TIME_LEADERBOARD:-}
        VITE_ADSENSE_TIME_SIDEBAR: ${VITE_ADSENSE_TIME_SIDEBAR:-}
        VITE_ADSENSE_TIME_RESULTS: ${VITE_ADSENSE_TIME_RESULTS:-}
        VITE_ADSENSE_SEO_CLIENT: ${VITE_ADSENSE_SEO_CLIENT:-}
        VITE_ADSENSE_SEO_LEADERBOARD: ${VITE_ADSENSE_SEO_LEADERBOARD:-}
        VITE_ADSENSE_SEO_SIDEBAR: ${VITE_ADSENSE_SEO_SIDEBAR:-}
        VITE_ADSENSE_SEO_RESULTS: ${VITE_ADSENSE_SEO_RESULTS:-}
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
  redis_data:
